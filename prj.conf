CONFIG_GPIO=y

# === LoRa-подсистема Zephyr + SX1272 (backend loramac-node) ===
CONFIG_SPI=y
CONFIG_LORA=y
# loramac-node реализует низкоуровневый драйвер SX127x и API lora_config/send/recv
CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE=y
# Выбор чипа определяется по devicetree (semtech,sx1272) -> HAS_SEMTECH_SX1272
# Включаем shell-команды lora (config/send/recv/test_cw) для интерактивной проверки
CONFIG_LORA_SHELL=y
# Поддержка LoRaWAN не нужна (работаем на уровне LoRa-модема), оставляем выключенной
CONFIG_LORAWAN=n

# === Консоль через SEGGER RTT (вместо USB CDC ACM) ===

# Базовая консоль
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# Отключаем UART-консоль, чтобы не было конфликта с RTT
CONFIG_UART_CONSOLE=n

# Включаем библиотеку SEGGER RTT
CONFIG_USE_SEGGER_RTT=y

# Направляем консольный вывод в RTT (Channel 0)
CONFIG_RTT_CONSOLE=y

# === Shell поверх RTT (Channel 0) ===
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_KERNEL_SHELL=y

# === Подсистема логирования (LOG_INF/LOG_ERR/...) в SEGGER RTT ===
# Включаем подсистему логирования Zephyr
CONFIG_LOG=y
# RTT-бекенд: направляет сообщения LOG_* в SEGGER RTT
CONFIG_LOG_BACKEND_RTT=y
# ВАЖНО: shell уже занимает RTT Channel 0 (CONFIG_SHELL_BACKEND_RTT_BUFFER=0).
# Zephyr запрещает два бекенда на одном канале (BUILD_ASSERT в shell_rtt.c),
# поэтому логи направляем на отдельный RTT Channel 1.
CONFIG_LOG_BACKEND_RTT_BUFFER=1
# Блокирующий режим (ждать освобождения буфера RTT) — надёжнее,
# но ценой задержок при переполнении. Альтернатива: DROP (терять).
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
# Максимальный размер одного сообщения лога (байт)
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256
# Уровень логирования по умолчанию (4 = INF, можно задать 3 = WRN и т.д.)
# CONFIG_LOG_DEFAULT_LEVEL=4
# Включаем цветной вывод (опционально, поддерживается RTT-вьюером)
CONFIG_LOG_BACKEND_SHOW_COLOR=y

# ================================================================== #
#  Bluetooth LE HID-устройство ( stm32_button )                       #
#                                                                     #
#  Радиомодуль STM32WB55 (CPU2) управляется через IPCC/IPM-драйвер    #
#  (drivers/bluetooth/hci/ipm_stm32wb.c). Узел ble_rf уже включён     #
#  в stm32wb.dtsi, а zephyr,bt-hci = &ble_rf — в chosen.              #
#  Поэтому CONFIG_BT_STM32_IPM включается автоматически.              #
# ================================================================== #

# Базовый стек Bluetooth LE (Host + Controller-драйвер IPM)
CONFIG_BT=y

# Периферийная роль (обходимся как HID-клавиатура/пульт)
CONFIG_BT_PERIPHERAL=y

# Менеджер безопасности (SMP): HID требует шифрованного канала
CONFIG_BT_SMP=y

# Хранение ключей спаривания во flash (NVS).
# ОТКЛЮЧЕНО: вызывает Bus Fault при доступе к storage_partition
# (адрес 0x080D8FF8, Precise data bus error) во время bt_enable().
# Без этих настроек устройство работает, но требует перепривязки
# при каждом включении (bonding не сохраняется).
# CONFIG_BT_SETTINGS=y
# CONFIG_SETTINGS=y
# CONFIG_FLASH=y
# CONFIG_FLASH_MAP=y
# CONFIG_NVS=y

# Имя устройства, которое увидит хост (телефон/ПК) при сканировании
CONFIG_BT_DEVICE_NAME="stm32_button"

# Внешний вид (Appearance): 0x03C1 = 961 = HID Generic Keyboard
CONFIG_BT_DEVICE_APPEARANCE=961

# Увеличиваем стек системной очереди работ (settings/BT требуют больше)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
